
{% extends "base.html" %}

{% block content %}
<style>
    .demo-card textarea,
    .demo-card input[type="text"] {
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
        white-space: pre-wrap !important;
        overflow-wrap: anywhere !important;
        font-family: inherit !important;
        font-size: 14px !important;
    }

    .tab-content {
        display: none;
    }

    .tab-content.active {
        display: block;
    }

    .demo-tab-navigation {
        display: flex;
        gap: 10px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }

    .demo-tab-navigation .tab-btn {
        background: #1e293b;
        color: #94a3b8;
        border: 1px solid #334155;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s, color 0.2s;
    }

    .demo-tab-navigation .tab-btn.active-tab-btn {
        background: var(--accent-indigo);
        color: #fff;
        border: none;
        font-weight: 700;
    }

    @media (max-width: 768px) {
        .demo-tab-navigation {
            flex-direction: column;
        }

        .demo-tab-navigation .tab-btn {
            width: 100%;
            text-align: left;
        }
    }
</style>

<!-- HEADER -->
<div class="hero-banner" style="margin-bottom: 24px;">
    <h1 style="font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 6px;">
        <i class="fa-solid fa-file-signature text-rose me-2"></i>
        SecureCrypt — Digital Signature System
    </h1>

    <div style="color: var(--text-muted); font-size: 14px;">
        Hệ thống ký số, xác minh chữ ký và bảo vệ tính toàn vẹn tài liệu PDF.
    </div>
</div>

<!-- ĐIỀU HƯỚNG TAB -->
<div class="demo-tab-navigation">
    <button
        type="button"
        class="btn tab-btn active-tab-btn"
        onclick="switchTab(0)"
        aria-controls="tabContent0"
        aria-selected="true"
    >
        <i class="fa-solid fa-shield me-1"></i>
        So sánh Cặp Thuật toán Mật mã
    </button>

    <button
        type="button"
        class="btn tab-btn"
        onclick="switchTab(1)"
        aria-controls="tabContent1"
        aria-selected="false"
    >
        <i class="fa-solid fa-file-shield me-1"></i>
        SecureShare (Chia sẻ tài liệu mật)
    </button>

    <button
        type="button"
        class="btn tab-btn"
        onclick="switchTab(2)"
        aria-controls="tabContent2"
        aria-selected="false"
    >
        <i class="fa-solid fa-file-signature me-1"></i>
        Digital Signature (Chữ ký số PDF)
    </button>
</div>

<!-- TAB 1: SO SÁNH THUẬT TOÁN -->
<div class="tab-content active" id="tabContent0">
    {% include '_demo_tab1.html' %}
</div>

<!-- TAB 2: SECURESHARE -->
<div class="tab-content" id="tabContent1">
    {% include '_demo_tab2.html' %}
</div>

<!-- TAB 3: DIGITAL SIGNATURE -->
<div class="tab-content" id="tabContent2">
    {% include '_demo_tab3.html' %}
</div>

<script>
(function () {
    function switchTab(index) {
        const contents = document.querySelectorAll('.tab-content');
        const buttons = document.querySelectorAll(
            '.demo-tab-navigation .tab-btn'
        );

        if (
            !Number.isInteger(index) ||
            index < 0 ||
            index >= contents.length ||
            index >= buttons.length
        ) {
            return;
        }

        contents.forEach((content, i) => {
            const isActive = i === index;

            content.classList.toggle('active', isActive);
            content.setAttribute('aria-hidden', String(!isActive));
        });

        buttons.forEach((button, i) => {
            const isActive = i === index;

            button.classList.toggle('active-tab-btn', isActive);
            button.setAttribute('aria-selected', String(isActive));
        });
    }

    // Cho phép các nút gọi switchTab() thông qua onclick.
    window.switchTab = switchTab;

    // Đồng bộ trạng thái ban đầu.
    document.addEventListener('DOMContentLoaded', function () {
        const buttons = Array.from(
            document.querySelectorAll(
                '.demo-tab-navigation .tab-btn'
            )
        );

        const activeIndex = buttons.findIndex(
            button => button.classList.contains('active-tab-btn')
        );

        switchTab(activeIndex >= 0 ? activeIndex : 0);
    });
})();
</script>
{% endblock %}
