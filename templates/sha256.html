{% extends "base.html" %}

{% block content %}
<div class="hero-banner" style="margin-bottom: 24px;">
    <h1 style="font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 6px;">Hàm băm SHA-256 (Secure Hash Algorithm)</h1>
    <div style="color: var(--text-muted); font-size: 14px;">Hàm băm an toàn thuộc họ SHA-2 (256-bit Digest), dùng xác thực tính toàn vẹn dữ liệu.</div>
</div>

<div class="crypto-card">
    <div class="card-title-header">
        <i class="fa-solid fa-hashtag text-cyan"></i> Tính toán Giá trị Băm SHA-256
    </div>

    <label style="font-weight: 600; font-size: 13px; color: #cbd5e1;">Input Text (Văn bản đầu vào):</label>
    <textarea id="hashInput" rows="3" placeholder="Nhập văn bản cần băm..." oninput="calculateHash()"></textarea>

    <label style="font-weight: 600; font-size: 13px; color: #cbd5e1; margin-top: 12px; display: block;">SHA-256 Digest Output (64 Hex chars):</label>
    <input type="text" id="hashOutput" value="" readonly placeholder="Mã băm SHA-256 sẽ tự động tính toán real-time..." style="color: var(--accent-cyan) !important; font-weight: bold;">

    <div class="step-trace-box" id="hashVisual" style="display: none;">
        <div class="step-trace-title"><i class="fa-solid fa-cubes"></i> Trực quan hóa Cấu trúc Merkle–Damgård (64 Rounds)</div>
        <div id="hashTraceText" style="font-size: 13px; color: #cbd5e1; line-height: 1.6;"></div>
    </div>
</div>

<script>
async function calculateHash() {
    let text = document.getElementById('hashInput').value;
    if(!text) {
        document.getElementById('hashOutput').value = '';
        document.getElementById('hashVisual').style.display = 'none';
        return;
    }

    const msgUint8 = new TextEncoder().encode(text);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

    document.getElementById('hashOutput').value = hashHex;
    document.getElementById('hashVisual').style.display = 'block';
    document.getElementById('hashTraceText').innerHTML = `
        <div>• <strong>Đệm dữ liệu (Padding):</strong> Thêm bit '1' và các bit '0' sao cho độ dài văn bản ≡ 448 mod 512.</div>
        <div>• <strong>Khởi tạo thanh ghi (H0..H7):</strong> 8 giá trị băm ban đầu từ hằng số căn bậc hai số nguyên tố.</div>
        <div>• <strong>Nén 64 vòng lặp:</strong> Áp dụng các hàm phi tuyến Ch, Maj, Σ₀, Σ₁.</div>
    `;
}
</script>
{% endblock %}
