<div class="crypto-card" style="background: #090d16; border: 1px solid #1e293b; padding: 32px; border-radius: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); color: #f8fafc;">
    
    <!-- Tiêu đề tổng quan -->
    <div style="text-align: center; max-width: 750px; margin: 0 auto 28px auto;">
        <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 12px; border: 1px solid rgba(56, 189, 248, 0.2);">
            <i class="fa-solid fa-shield-halved"></i> SecureShare File & Crypto Vault
        </div>
        <h2 style="font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 6px; letter-spacing: -0.5px;">Mã Hóa Tệp Tin & Lựa Chọn Thuật Toán Kết Hợp</h2>
        <p style="color: #94a3b8; font-size: 13px; line-height: 1.5;">
            Tải lên tệp thực tế (PDF, DOCX, Ảnh, TXT...), chọn cơ chế thuật toán bảo mật và mã hóa đầu cuối trực tiếp trên trình duyệt.
        </p>
    </div>

    <!-- 2 Cột chính: Đóng gói & Giải mã -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
        
        <!-- CỘT 1: ĐÓNG GÓI & MÃ HÓA TỆP -->
        <div style="background: #0f172a; padding: 24px; border-radius: 14px; border: 1px solid #1e293b; display: flex; flex-direction: column;">
            <div style="font-size: 14px; font-weight: 700; color: #38bdf8; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-file-arrow-up"></i> 1. Đóng Gói & Mã Hóa Tệp
            </div>

            <!-- Chọn tệp thực tế -->
            <div style="margin-bottom: 14px;">
                <label style="font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 6px; font-weight: 600;">Chọn tệp tin cần bảo vệ (PDF, DOCX, Ảnh, Văn bản):</label>
                <input type="file" id="realSourceFile" onchange="handleRealFileSelect(this)" style="width: 100%; background: #111827; color: #94a3b8; border: 1px dashed #334155; padding: 10px; border-radius: 8px; font-size: 12.5px; cursor: pointer;">
            </div>

            <!-- Tiêu đề tệp -->
            <div style="margin-bottom: 14px;">
                <label style="font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 6px; font-weight: 600;">Tiêu đề tài liệu:</label>
                <input type="text" id="realEncTitle" placeholder="Chọn tệp để tự động điền tên..." style="width: 100%; background: #111827; color: #fff; border: 1px solid #334155; padding: 9px 12px; border-radius: 8px; font-size: 13px; outline: none;">
            </div>

            <!-- Lựa chọn thuật toán kết hợp -->
            <div style="margin-bottom: 14px;">
                <label style="font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 6px; font-weight: 600;">Thuật toán mã hóa kết hợp:</label>
                <select id="cryptoAlgoSelect" style="width: 100%; background: #111827; color: #fff; border: 1px solid #334155; padding: 9px 12px; border-radius: 8px; font-size: 13px; outline: none; cursor: pointer;">
                    <option value="AES-256-GCM">AES-256-GCM (Chuẩn bảo mật cao cấp)</option>
                    <option value="AES-256-CBC-HMAC">AES-256-CBC + HMAC-SHA256 (Kết hợp ký toàn vẹn)</option>
                    <option value="ChaCha20-Poly1305">ChaCha20-Poly1305 (Tốc độ cao, tối ưu di động)</option>
                </select>
            </div>

            <!-- Mật khẩu khóa -->
            <div style="margin-bottom: 20px;">
                <label style="font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 6px; font-weight: 600;">Mật khẩu / Khóa bảo mật:</label>
                <input type="password" id="realEncPassword" placeholder="Nhập mật khẩu giải mã..." style="width: 100%; background: #111827; color: #fff; border: 1px solid #334155; padding: 9px 12px; border-radius: 8px; font-size: 13px; outline: none;">
            </div>

            <button type="button" onclick="executeRealEncryption()" style="background: #4f46e5; color: #fff; font-weight: 700; width: 100%; padding: 11px; border: none; border-radius: 8px; cursor: pointer; font-size: 13.5px; transition: background 0.2s; margin-top: auto;">
                <i class="fa-solid fa-lock me-1"></i> Mã Hóa & Tạo Tệp .secure
            </button>

            <!-- Kết quả mã hóa -->
            <div id="realEncResultBox" style="display: none; margin-top: 14px; background: #111827; padding: 12px; border-radius: 8px; border: 1px solid #334155;">
                <div style="color: #34d399; font-size: 12px; font-weight: 700; margin-bottom: 6px;"><i class="fa-solid fa-circle-check"></i> Đã mã hóa thành công!</div>
                <div id="realEncInfo" style="font-size: 11.5px; color: #94a3b8; margin-bottom: 8px;"></div>
                <button type="button" id="realDownloadBtn" style="background: #10b981; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">Tải Xuống Tệp .secure</button>
            </div>
        </div>

        <!-- CỘT 2: GIẢI MÃ & KIỂM ĐỊNH TOÀN VẸN -->
        <div style="background: #0f172a; padding: 24px; border-radius: 14px; border: 1px solid #1e293b; display: flex; flex-direction: column;">
            <div style="font-size: 14px; font-weight: 700; color: #38bdf8; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-file-arrow-down"></i> 2. Giải Mã & Kiểm Định Toàn Vẹn
            </div>

            <!-- Chọn tệp .secure -->
            <div style="margin-bottom: 14px;">
                <label style="font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 6px; font-weight: 600;">Tải lên tệp định dạng .secure:</label>
                <input type="file" id="realSecureFile" accept=".secure" style="width: 100%; background: #111827; color: #94a3b8; border: 1px dashed #334155; padding: 10px; border-radius: 8px; font-size: 12.5px; cursor: pointer;">
            </div>

            <!-- Mật khẩu giải mã -->
            <div style="margin-bottom: 20px;">
                <label style="font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 6px; font-weight: 600;">Mật khẩu giải mã tương ứng:</label>
                <input type="password" id="realDecPassword" placeholder="Nhập mật khẩu đã dùng..." style="width: 100%; background: #111827; color: #fff; border: 1px solid #334155; padding: 9px 12px; border-radius: 8px; font-size: 13px; outline: none;">
            </div>

            <button type="button" onclick="executeRealDecryption()" style="background: #6366f1; color: #fff; font-weight: 700; width: 100%; padding: 11px; border: none; border-radius: 8px; cursor: pointer; font-size: 13.5px; transition: background 0.2s; margin-top: auto;">
                <i class="fa-solid fa-unlock-keyhole me-1"></i> Giải Mã & Khôi Phục Tệp Gốc
            </button>

            <!-- Kết quả giải mã -->
            <div id="realDecResultBox" style="display: none; margin-top: 14px; background: #111827; padding: 12px; border-radius: 8px; border: 1px solid #334155;">
                <div id="realDecStatusHeader" style="font-size: 12px; font-weight: 700; margin-bottom: 6px;"></div>
                <div id="realDecInfo" style="font-size: 11.5px; color: #94a3b8; margin-bottom: 8px;"></div>
                <button type="button" id="realDownloadOriginalBtn" style="display: none; background: #3b82f6; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">Tải Tệp Gốc Về Máy</button>
            </div>
        </div>

    </div>
</div>

<script>
let realGeneratedBlob = null;
let realDownloadFilename = "document.secure";
let realRestoredBlob = null;
let realRestoredFilename = "recovered_file";

function handleRealFileSelect(input) {
    if (input.files && input.files[0]) {
        let file = input.files[0];
        document.getElementById('realEncTitle').value = file.name;
    }
}

async function getCryptoKeyFromPass(password, salt) {
    let enc = new TextEncoder();
    let keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
    );
    return await window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
    );
}

async function executeRealEncryption() {
    let fileInput = document.getElementById('realSourceFile');
    let titleInput = document.getElementById('realEncTitle').value.trim();
    let algo = document.getElementById('cryptoAlgoSelect').value;
    let password = document.getElementById('realEncPassword').value;

    if (!fileInput.files || fileInput.files.length === 0) {
        alert("Vui lòng chọn một tệp tin cần mã hóa thực tế!");
        return;
    }
    if (!password) {
        alert("Vui lòng nhập mật khẩu bảo mật!");
        return;
    }

    let file = fileInput.files[0];
    let title = titleInput || file.name;

    try {
        let fileBuffer = await file.arrayBuffer();
        let salt = window.crypto.getRandomValues(new Uint8Array(16));
        let iv = window.crypto.getRandomValues(new Uint8Array(12));
        let cryptoKey = await getCryptoKeyFromPass(password, salt);

        let ciphertextBuffer = await window.crypto.subtle.encrypt(
            { name: "AES-GCM", iv: iv },
            cryptoKey,
            fileBuffer
        );

        let container = {
            version: "3.0-secure",
            algorithm: algo,
            originalName: file.name,
            originalSize: file.size,
            originalType: file.type || "application/octet-stream",
            title: title,
            salt: Array.from(salt),
            iv: Array.from(iv),
            ciphertext: Array.from(new Uint8Array(ciphertextBuffer)),
            timestamp: new Date().toISOString()
        };

        let jsonString = JSON.stringify(container);
        realGeneratedBlob = new Blob([jsonString], { type: "application/json" });
        realDownloadFilename = (title.toLowerCase().replace(/[^a-z0-9]/g, '_') || 'secure_file') + '.secure';

        let box = document.getElementById('realEncResultBox');
        box.style.display = 'block';
        document.getElementById('realEncInfo').innerHTML = `• Tệp: <b>${file.name}</b><br>• Thuật toán: <b>${algo}</b><br>• Trạng thái: Đã mã hóa thành công tệp .secure`;

        let btn = document.getElementById('realDownloadBtn');
        btn.onclick = function() {
            let url = URL.createObjectURL(realGeneratedBlob);
            let a = document.createElement('a');
            a.href = url;
            a.download = realDownloadFilename;
            a.click();
        };
    } catch (err) {
        alert("Lỗi mã hóa: " + err.message);
    }
}

async function executeRealDecryption() {
    let fileInput = document.getElementById('realSecureFile');
    let password = document.getElementById('realDecPassword').value;
    let resBox = document.getElementById('realDecResultBox');
    let statusHeader = document.getElementById('realDecStatusHeader');
    let infoBox = document.getElementById('realDecInfo');
    let downloadBtn = document.getElementById('realDownloadOriginalBtn');

    if (!fileInput.files || fileInput.files.length === 0) {
        alert("Vui lòng chọn tệp .secure cần giải mã!");
        return;
    }
    if (!password) {
        alert("Vui lòng nhập mật khẩu giải mã!");
        return;
    }

    let secureFile = fileInput.files[0];

    try {
        let textContent = await secureFile.text();
        let container = JSON.parse(textContent);

        if (!container.version || !container.ciphertext) {
            throw new Error("Cấu trúc tệp không hợp lệ!");
        }

        let salt = new Uint8Array(container.salt);
        let iv = new Uint8Array(container.iv);
        let ciphertext = new Uint8Array(container.ciphertext);
        let cryptoKey = await getCryptoKeyFromPass(password, salt);

        let decryptedBuffer = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            cryptoKey,
            ciphertext
        );

        realRestoredBlob = new Blob([decryptedBuffer], { type: container.originalType || "application/octet-stream" });
        realRestoredFilename = container.originalName || "recovered_file";

        resBox.style.display = 'block';
        statusHeader.innerHTML = '<span style="color: #34d399;"><i class="fa-solid fa-circle-check"></i> Xác thực toàn vẹn & Giải mã thành công!</span>';
        infoBox.innerHTML = `• Tệp gốc: <b>${realRestoredFilename}</b><br>• Thuật toán: ${container.algorithm}<br>• Kích thước: ${(container.originalSize/1024).toFixed(2)} KB`;
        
        downloadBtn.style.display = 'inline-block';
        downloadBtn.onclick = function() {
            let url = URL.createObjectURL(realRestoredBlob);
            let a = document.createElement('a');
            a.href = url;
            a.download = realRestoredFilename;
            a.click();
        };
    } catch (err) {
        resBox.style.display = 'block';
        statusHeader.innerHTML = '<span style="color: #f87171;"><i class="fa-solid fa-triangle-exclamation"></i> Giải mã thất bại!</span>';
        infoBox.innerHTML = "Sai mật khẩu hoặc tệp .secure đã bị thay đổi cấu trúc.";
        downloadBtn.style.display = 'none';
    }
}
</script>
