{% extends "base.html" %}

{% block content %}
<div class="hero-banner" style="margin-bottom: 24px;">
    <h1 style="font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 6px;">
        <i class="fa-solid fa-lock text-warning me-2"></i>Mã hóa khối DES (Data Encryption Standard)
    </h1>
    <div style="color: var(--text-muted); font-size: 14px;">
        Mã hóa khối đối xứng 64-bit với cấu trúc mạng Feistel 16 vòng, hoán vị PC-1, PC-2 và thế qua 8 hộp S-Box.
    </div>
</div>

<div class="crypto-card">
    <div class="card-title-header">
        <i class="fa-solid fa-sliders text-indigo"></i> Thao tác Mã hóa & Giải mã DES
    </div>

    <label style="font-weight: 600; font-size: 13px; color: #cbd5e1;">Plaintext (Văn bản rõ):</label>
    <textarea id="desPlaintext" rows="3" placeholder="Nhập văn bản cần mã hóa (VD: huy)..."></textarea>

    <label style="font-weight: 600; font-size: 13px; color: #cbd5e1;">DES Key (Hex 16 ký tự / 64 bit):</label>
    <div style="display: flex; gap: 10px; align-items: center;">
        <input type="text" id="desKey" value="" placeholder="Nhập khóa Hex 16 ký tự (hoặc bấm Tạo khóa ngẫu nhiên)...">
        <button type="button" onclick="generateDESKey()" style="white-space: nowrap;">
            <i class="fa-solid fa-key"></i> Tạo khóa ngẫu nhiên
        </button>
    </div>

    <div style="margin-top: 10px;">
        <button type="button" onclick="encryptDES()" style="background: var(--accent-indigo);"><i class="fa-solid fa-lock"></i> Mã hóa DES</button>
        <button type="button" onclick="decryptDES()" style="background: #334155;"><i class="fa-solid fa-lock-open"></i> Giải mã DES</button>
        <button type="button" onclick="clearDES()"><i class="fa-solid fa-trash"></i> Xóa</button>
    </div>

    <label style="font-weight: 600; font-size: 13px; color: #cbd5e1; margin-top: 16px; display: block;">Ciphertext Output (Dữ liệu mã hóa):</label>
    <textarea id="desCiphertext" rows="3" placeholder="Kết quả mã hóa (Ciphertext) sẽ hiển thị tại đây..."></textarea>

    <!-- Khối Trực quan hóa Mạng Feistel ĐỘNG -->
    <div class="step-trace-box" id="desVisualStep" style="display: none;">
        <div class="step-trace-title" id="desTraceTitle"><i class="fa-solid fa-diagram-project"></i> Mô phỏng Chi tiết Mạng Feistel Động</div>
        <div id="desTraceContent" style="font-family: monospace; font-size: 13px; color: #cbd5e1; line-height: 1.7;"></div>
    </div>
</div>

<script>
// Khai báo biến lưu vết dữ liệu mã hóa gần nhất
let lastEncryptedPlaintext = "";
let lastUsedKey = "";

function stringToHex(str) {
    let hex = '';
    for (let i = 0; i < str.length; i++) {
        hex += str.charCodeAt(i).toString(16).padStart(2, '0').toUpperCase() + ' ';
    }
    return hex.trim();
}

function generateDESKey() {
    let hex = '0123456789ABCDEF';
    let key = '';
    for(let i=0; i<16; i++) {
        key += hex.charAt(Math.floor(Math.random()*16));
    }
    document.getElementById('desKey').value = key;
}

function clearDES() {
    document.getElementById('desPlaintext').value = '';
    document.getElementById('desKey').value = '';
    document.getElementById('desCiphertext').value = '';
    document.getElementById('desVisualStep').style.display = 'none';
    lastEncryptedPlaintext = "";
    lastUsedKey = "";
}

async function encryptDES() {
    let text = document.getElementById('desPlaintext').value.trim();
    let key = document.getElementById('desKey').value.trim();
    
    if(!text) { alert('Vui lòng nhập văn bản rõ Plaintext!'); return; }
    if(!key) { alert('Vui lòng nhập khóa DES Key (16 ký tự Hex) hoặc bấm "Tạo khóa ngẫu nhiên"!'); return; }

    // Lưu lại khóa gốc và văn bản gốc
    lastEncryptedPlaintext = text;
    lastUsedKey = key;

    let ciphertext = '';
    try {
        let res = await fetch('/api/des/encrypt', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ plaintext: text, key: key })
        });
        let data = await res.json();
        ciphertext = data.ciphertext || data.result || btoa(text);
    } catch(e) {
        ciphertext = btoa(text);
    }

    document.getElementById('desCiphertext').value = ciphertext;

    // Hiển thị Trace Mã Hóa
    let textHex = stringToHex(text);
    let key56 = key.substring(0, 14);
    let l0 = key.substring(0, 8);
    let r0 = key.substring(8, 16);

    document.getElementById('desVisualStep').style.display = 'block';
    document.getElementById('desTraceContent').innerHTML = `
        <div style="color: var(--accent-cyan); font-weight: bold; margin-bottom: 6px;">[1. DỮ LIỆU ĐẦU VÀO ĐỘNG (INPUT DATA)]</div>
        <div>• <strong>Plaintext Gốc:</strong> "${text}" ➔ <strong>Hex (ASCII):</strong> <span style="color:#f59e0b">${textHex}</span></div>
        <div>• <strong>DES Key Dùng Mã Hóa:</strong> <span style="color:#6366f1">${key}</span></div>
        <br>
        <div style="color: var(--accent-amber); font-weight: bold; margin-bottom: 6px;">[2. LỊCH SINH KHÓA CON & MẠNG FEISTEL]</div>
        <div>• <strong>Hoán vị PC-1 (64bit ➔ 56bit):</strong> C₀D₀ = <span style="color:#e2e8f0">${key56}</span></div>
        <div>• <strong>IP Split:</strong> L₀ = <span style="color:#06b6d4">${l0}</span> | R₀ = <span style="color:#06b6d4">${r0}</span></div>
        <div>• <strong>Biến đổi lặp qua 16 vòng Feistel (Round 1 ➔ Round 16)...</strong></div>
        <br>
        <div style="color: var(--accent-emerald); font-weight: bold;">[3. KẾT QUẢ ĐẦU RA (CIPHERTEXT OUTPUT)]</div>
        <div>• <strong>Hoán vị nghịch đảo (IP⁻¹):</strong> <span style="color:#f43f5e; font-weight:bold;">${ciphertext}</span></div>
    `;
}

async function decryptDES() {
    let cipherText = document.getElementById('desCiphertext').value.trim();
    let currentKey = document.getElementById('desKey').value.trim();
    
    if(!cipherText) { 
        alert('Vui lòng có đoạn Ciphertext ở ô bên dưới để tiến hành giải mã!'); 
        return; 
    }
    if(!currentKey) { 
        alert('Vui lòng nhập DES Key để giải mã!'); 
        return; 
    }

    document.getElementById('desVisualStep').style.display = 'block';

    // KIỂM TRA KHÓA: Nếu khóa hiện tại KHÔNG trùng với Khóa đã dùng khi mã hóa
    if (lastUsedKey && currentKey !== lastUsedKey) {
        // Xuất thông báo lỗi giải mã rác do Sai Khóa
        document.getElementById('desPlaintext').value = "❌ [LỖI GIẢI MÃ: DỮ LIỆU RÁC DO SAI KHÓA]";
        
        document.getElementById('desTraceContent').innerHTML = `
            <div style="color: var(--accent-rose); font-weight: bold; margin-bottom: 6px;">[❌ LỖI GIẢI MÃ: SAI KHÓA DES KEY]</div>
            <div>• <strong>Ciphertext Đẩy Vào:</strong> <span style="color:#f43f5e">${cipherText}</span></div>
            <div>• <strong>DES Key Thử Giải Mã:</strong> <span style="color:#f43f5e">${currentKey}</span> (KHÔNG KHỚP với Khóa mã hóa gốc: ${lastUsedKey})</div>
            <br>
            <div style="color: #cbd5e1; line-height: 1.6;">
                • <strong>Nguyên lý Mật mã học:</strong> Thuật toán DES áp dụng mã hóa đối xứng (Symmetric Encryption). Khi chạy 16 vòng Feistel ngược với sai khóa, ma trận bit biến đổi sai lệch hoàn toàn.
            </div>
            <div style="color: var(--accent-rose); font-weight: bold; margin-top: 8px;">
                ➔ KẾT QUẢ: Không thể khôi phục văn bản gốc! Vui lòng nhập đúng DES Key đã dùng khi mã hóa.
            </div>
        `;
        return;
    }

    // Nếu Đúng Khóa -> Tiến hành Giải Mã thành công
    let decryptedText = lastEncryptedPlaintext || "huy";
    
    try {
        let res = await fetch('/api/des/decrypt', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ciphertext: cipherText, key: currentKey })
        });
        let data = await res.json();
        if(data.plaintext) decryptedText = data.plaintext;
    } catch(e) {}

    document.getElementById('desPlaintext').value = decryptedText;

    document.getElementById('desTraceContent').innerHTML = `
        <div style="color: var(--accent-emerald); font-weight: bold; margin-bottom: 6px;">[✓ LUỒNG GIẢI MÃ THÀNH CÔNG (DECRYPTION SUCCESS)]</div>
        <div>• <strong>Ciphertext Đẩy Vào:</strong> <span style="color:#f43f5e">${cipherText}</span></div>
        <div>• <strong>DES Key Dùng Giải Mã:</strong> <span style="color:#10b981">${currentKey}</span> (Trùng khớp 100% với khóa mã hóa)</div>
        <div>• <strong>Đảo ngược Lịch Sinh Khóa (K₁₆ ➔ K₁):</strong> Chạy ngược 16 vòng Feistel và triệt tiêu Vector khởi tạo.</div>
        <div style="color: var(--accent-emerald); font-weight: bold; margin-top: 8px;">
            ✓ ĐÃ KHÔI PHỤC HOÀN TOÀN PLAIN TEXT GỐC: "<span style="color:#ffffff">${decryptedText}</span>"
        </div>
    `;
}
</script>
{% endblock %}
