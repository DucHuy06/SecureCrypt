<div id="secureChatApp" class="crypto-card">
  <style>
    #secureChatApp {
      background: #090d16;
      color: #f8fafc;
      border: 1px solid #1e293b;
      padding: 24px;
      border-radius: 18px;
      height: 760px;
      max-height: 85vh;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      font-family: inherit;
      box-sizing: border-box;
    }

    #secureChatApp * { box-sizing: border-box; }
    #secureChatApp button,
    #secureChatApp input { font: inherit; }
    #secureChatApp button { cursor: pointer; }
    #secureChatApp button:disabled { opacity: .55; cursor: not-allowed; }

    #secureChatApp .sc-muted {
      color: #94a3b8;
      font-size: 12px;
    }

    #secureChatApp .sc-primary {
      background: #4f46e5;
      color: white;
      border: 0;
    }

    #secureChatApp .sc-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }

    #secureChatApp .sc-btn {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    #secureChatApp .sc-input {
      width: 100%;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 11px 12px;
      border-radius: 8px;
      outline: none;
      min-width: 0;
    }

    #secureChatApp .sc-input:focus { border-color: #818cf8; }

    #secureChatApp .sc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
      margin-bottom: 16px;
    }

    #secureChatApp .sc-layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 14px;
    }

    #secureChatApp .sc-sidebar,
    #secureChatApp .sc-conversation {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      min-height: 0;
      overflow: hidden;
    }

    #secureChatApp .sc-sidebar {
      display: flex;
      flex-direction: column;
    }

    #secureChatApp .sc-side-title {
      padding: 14px;
      border-bottom: 1px solid #1e293b;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
    }

    #secureChatApp .sc-rooms {
      padding: 8px;
      overflow-y: auto;
    }

    #secureChatApp .sc-room {
      display: block;
      width: 100%;
      text-align: left;
      padding: 11px;
      margin-bottom: 5px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #cbd5e1;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #secureChatApp .sc-room.active {
      background: #4f46e5;
      color: white;
    }

    #secureChatApp .sc-conversation {
      display: flex;
      flex-direction: column;
    }

    #secureChatApp .sc-room-header {
      padding: 13px 16px;
      background: #111827;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    #secureChatApp .sc-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #090d16;
    }

    #secureChatApp .sc-message {
      max-width: 85%;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #secureChatApp .sc-message.mine {
      align-self: flex-end;
      background: #4f46e5;
    }

    #secureChatApp .sc-message.other {
      align-self: flex-start;
      background: #1e293b;
    }

    #secureChatApp .sc-message-meta {
      font-size: 10px;
      color: #cbd5e1;
      margin-top: 5px;
      text-align: right;
    }

    #secureChatApp .sc-compose {
      padding: 12px;
      display: flex;
      gap: 8px;
      background: #111827;
      border-top: 1px solid #1e293b;
    }

    #secureChatApp .sc-status {
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }

    #secureChatApp .sc-status.error { color: #f87171; }
    #secureChatApp .sc-status.success { color: #34d399; }

    #secureChatApp .sc-auth {
      margin: auto;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
    }

    #secureChatApp .sc-auth h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    #secureChatApp .sc-auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    #secureChatApp .sc-hidden { display: none !important; }

    #secureChatApp .sc-empty {
      margin: auto;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      padding: 20px;
    }
  </style>

  <!-- HEADER -->
  <div class="sc-header">
    <div style="display:flex;align-items:center;gap:12px;min-width:0">
      <div style="width:40px;height:40px;border-radius:11px;background:#4f46e5;display:grid;place-items:center;flex-shrink:0">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <h3 style="margin:0 0 4px;font-size:18px">SecureChat (E2EE)</h3>
        <div class="sc-muted">Nhắn tin mã hóa đầu cuối chuẩn AES-GCM</div>
      </div>
    </div>

    <div style="text-align:right">
      <div id="scAccountLabel" style="font-size:12px;color:#34d399">
        Chưa đăng nhập
      </div>
      <button id="scLogoutBtn" type="button"
        class="sc-btn sc-secondary sc-hidden" style="margin-top:6px">
        Đăng xuất
      </button>
    </div>
  </div>

  <!-- ĐĂNG NHẬP / ĐĂNG KÝ -->
  <section id="scAuthView" class="sc-auth">
    <h3 id="scAuthTitle">Đăng nhập SecureChat</h3>
    <p class="sc-muted">
      Đăng ký hoặc đăng nhập để trò chuyện bảo mật.
    </p>

    <div style="display:flex;gap:8px;margin-top:18px">
      <button id="scLoginTab" class="sc-btn sc-primary"
        type="button" style="flex:1">
        Đăng nhập
      </button>

      <button id="scRegisterTab" class="sc-btn sc-secondary"
        type="button" style="flex:1">
        Đăng ký
      </button>
    </div>

    <form id="scAuthForm" class="sc-auth-form">
      <div>
        <label for="scUsername" class="sc-muted">Tên tài khoản</label>
        <input id="scUsername" class="sc-input" name="username"
          autocomplete="username" required minlength="3" maxlength="40"
          placeholder="Nhập tên tài khoản">
      </div>

      <div>
        <label for="scPassword" class="sc-muted">Mật khẩu</label>
        <input id="scPassword" class="sc-input" name="password"
          type="password" autocomplete="current-password"
          required minlength="6" maxlength="128"
          placeholder="Nhập mật khẩu">
      </div>

      <button id="scAuthSubmit" type="submit"
        class="sc-btn sc-primary">
        Đăng nhập
      </button>
    </form>

    <div id="scAuthStatus" class="sc-status"
      role="status" aria-live="polite"></div>
  </section>

  <!-- GIAO DIỆN CHAT -->
  <section id="scChatView" class="sc-layout sc-hidden">
    <aside class="sc-sidebar">
      <div class="sc-side-title">NGƯỜI DÙNG</div>

      <div style="padding:8px;border-bottom:1px solid #1e293b">
        <button id="scRefreshUsers" class="sc-btn sc-secondary"
          type="button" style="width:100%">
          Làm mới danh sách
        </button>
      </div>

      <div id="scRooms" class="sc-rooms">
        <div class="sc-empty">Đang tải người dùng…</div>
      </div>
    </aside>

    <section class="sc-conversation">
      <div class="sc-room-header">
        <div style="min-width:0">
          <div id="scRoomTitle" style="font-weight:700">
            Chọn người trò chuyện
          </div>
          <div id="scRoomSubtitle" class="sc-muted" style="margin-top:4px">
            Chọn tài khoản ở cột bên trái
          </div>
        </div>

        <span id="scConnectionStatus" class="sc-muted">
          Đã kết nối E2EE
        </span>
      </div>

      <div id="scMessages" class="sc-messages" aria-live="polite">
        <div class="sc-empty">
          Chọn một tài khoản để bắt đầu trò chuyện mã hóa.
        </div>
      </div>

      <form id="scComposeForm" class="sc-compose">
        <input id="scMessageInput" class="sc-input"
          type="text" maxlength="4000" autocomplete="off"
          placeholder="Nhập tin nhắn bảo mật..." disabled>

        <button id="scSendBtn" type="submit"
          class="sc-btn sc-primary" disabled
          aria-label="Gửi tin nhắn">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </section>
  </section>

  <div id="scGlobalStatus" class="sc-status"
    role="status" aria-live="polite"></div>
</div>

<script>
(() => {
  'use strict';

  const root = document.getElementById('secureChatApp');
  if (!root || root.dataset.initialized === 'true') return;
  root.dataset.initialized = 'true';

  const $ = (id) => document.getElementById(id);

  const state = {
    username: null,
    authMode: 'login',
    partner: null,
    messages: [],
    pollTimer: null
  };

  // Quản lý tài khoản & tin nhắn hoàn toàn độc lập trên LocalStorage để test đa tab dễ dàng
  const DB = {
    getUsers() {
      try { return JSON.parse(localStorage.getItem('sc_users') || '[]'); } catch { return []; }
    },
    saveUsers(users) {
      localStorage.setItem('sc_users', JSON.stringify(users));
    },
    getCurrentUser() {
      return localStorage.getItem('sc_current_user');
    },
    setCurrentUser(username) {
      if (username) localStorage.setItem('sc_current_user', username);
      else localStorage.removeItem('sc_current_user');
    },
    getMessages() {
      try { return JSON.parse(localStorage.getItem('sc_messages') || '[]'); } catch { return []; }
    },
    saveMessages(msgs) {
      localStorage.setItem('sc_messages', JSON.stringify(msgs));
    }
  };

  async function getSharedKey(user1, user2) {
    const sorted = [user1, user2].sort().join(':');
    const enc = new TextEncoder().encode(sorted);
    const hash = await crypto.subtle.digest('SHA-256', enc);
    return crypto.subtle.importKey(
      'raw',
      hash,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  }

  async function encryptMessage(text, partnerName) {
    if (!state.username || !partnerName) return text;
    try {
      const key = await getSharedKey(state.username, partnerName);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(text);
      const encrypted = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        encoded
      );
      return 'E2EE:' + JSON.stringify({
        iv: btoa(String.fromCharCode(...iv)),
        data: btoa(String.fromCharCode(...new Uint8Array(encrypted)))
      });
    } catch (e) {
      console.error('Lỗi mã hóa:', e);
      return text;
    }
  }

  async function decryptMessage(cipherString, partnerName) {
    if (!cipherString || !cipherString.startsWith('E2EE:')) return cipherString;
    try {
      const parsed = JSON.parse(cipherString.substring(5));
      const iv = Uint8Array.from(atob(parsed.iv), c => c.charCodeAt(0));
      const data = Uint8Array.from(atob(parsed.data), c => c.charCodeAt(0));
      const key = await getSharedKey(state.username, partnerName);
      const decrypted = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        data
      );
      return new TextDecoder().decode(decrypted);
    } catch (e) {
      console.error('Lỗi giải mã:', e);
      return '[Tin nhắn được mã hóa hoặc sai khóa giải mã]';
    }
  }

  function setStatus(id, message, type = '') {
    const element = $(id);
    if (!element) return;
    element.textContent = message || '';
    element.className = 'sc-status' + (type ? ' ' + type : '');
  }

  function showEmptyMessage(message, container = $('scMessages')) {
    container.replaceChildren();
    const element = document.createElement('div');
    element.className = 'sc-empty';
    element.textContent = message;
    container.appendChild(element);
  }

  function setAuthMode(mode) {
    state.authMode = mode;
    const isRegister = mode === 'register';

    $('scAuthTitle').textContent = isRegister ? 'Đăng ký SecureChat' : 'Đăng nhập SecureChat';
    $('scAuthSubmit').textContent = isRegister ? 'Đăng ký tài khoản' : 'Đăng nhập';
    $('scLoginTab').className = 'sc-btn ' + (!isRegister ? 'sc-primary' : 'sc-secondary');
    $('scRegisterTab').className = 'sc-btn ' + (isRegister ? 'sc-primary' : 'sc-secondary');
    setStatus('scAuthStatus', '');
  }

  function showChatView(username) {
    state.username = username;
    DB.setCurrentUser(username);

    $('scAuthView').classList.add('sc-hidden');
    $('scChatView').classList.remove('sc-hidden');
    $('scLogoutBtn').classList.remove('sc-hidden');

    $('scAccountLabel').textContent = 'Tài khoản: ' + username;
    $('scConnectionStatus').textContent = 'Đã kết nối E2EE';

    loadUsers();
    startPolling();
  }

  function showAuthView() {
    stopPolling();
    state.username = null;
    state.partner = null;
    DB.setCurrentUser(null);

    $('scAuthView').classList.remove('sc-hidden');
    $('scChatView').classList.add('sc-hidden');
    $('scLogoutBtn').classList.add('sc-hidden');

    $('scAccountLabel').textContent = 'Chưa đăng nhập';
    $('scRoomTitle').textContent = 'Chọn người trò chuyện';
    $('scMessageInput').disabled = true;
    $('scSendBtn').disabled = true;
    showEmptyMessage('Chọn một tài khoản để bắt đầu trò chuyện.');
  }

  function handleAuth(event) {
    event.preventDefault();
    const username = $('scUsername').value.trim();
    const password = $('scPassword').value;

    if (!username || !password) {
      setStatus('scAuthStatus', 'Vui lòng nhập đầy đủ thông tin.', 'error');
      return;
    }

    const users = DB.users;

    if (state.authMode === 'register') {
      if (users.some(u => u.username === username)) {
        setStatus('scAuthStatus', 'Tên tài khoản này đã tồn tại.', 'error');
        return;
      }
      users.push({ username, password });
      DB.saveUsers(users);
      setStatus('scAuthStatus', 'Đăng ký thành công! Hãy chuyển sang đăng nhập.', 'success');
      setAuthMode('login');
      $('scPassword').value = '';
    } else {
      const found = users.find(u => u.username === username && u.password === password);
      if (!found) {
        setStatus('scAuthStatus', 'Sai tên tài khoản hoặc mật khẩu.', 'error');
        return;
      }
      showChatView(username);
      setStatus('scGlobalStatus', 'Đăng nhập thành công.', 'success');
    }
  }

  function loadUsers() {
    const allUsers = DB.getUsers().filter(u => u.username !== state.username);
    const container = $('scRooms');
    container.replaceChildren();

    if (!allUsers.length) {
      showEmptyMessage('Chưa có người dùng khác. Hãy mở tab khác đăng ký tài khoản mới.', container);
      $('scRoomTitle').textContent = 'Chưa có người dùng';
      return;
    }

    allUsers.forEach(u => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sc-room' + (u.username === state.partner ? ' active' : '');
      btn.textContent = '@ ' + u.username;
      btn.addEventListener('click', () => openConversation(u.username));
      container.appendChild(btn);
    });
  }

  function openConversation(username) {
    state.partner = username;
    $('scRoomTitle').textContent = username;
    $('scRoomSubtitle').textContent = 'Cuộc trò chuyện mã hóa E2EE';
    $('scMessageInput').disabled = false;
    $('scSendBtn').disabled = false;
    $('scMessageInput').focus();
    loadUsers();
    loadMessages();
  }

  async function loadMessages() {
    if (!state.username || !state.partner) return;
    const allMsgs = DB.getMessages();
    const conversation = allMsgs.filter(m => 
      (m.sender === state.username && m.recipient === state.partner) ||
      (m.sender === state.partner && m.recipient === state.username)
    );

    const decryptedList = [];
    for (const msg of conversation) {
      const plain = await decryptMessage(msg.ciphertext, state.partner);
      decryptedList.push({ ...msg, displayContent: plain });
    }

    state.messages = decryptedList;
    renderMessages();
  }

  function renderMessages() {
    const container = $('scMessages');
    const nearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 90;
    container.replaceChildren();

    if (!state.messages.length) {
      showEmptyMessage('Chưa có tin nhắn. Hãy gửi lời chào!');
      return;
    }

    state.messages.forEach(msg => {
      const mine = msg.sender === state.username;
      const bubble = document.createElement('div');
      bubble.className = 'sc-message ' + (mine ? 'mine' : 'other');

      const content = document.createElement('div');
      const sender = document.createElement('strong');
      sender.textContent = mine ? 'Bạn' : msg.sender;

      content.appendChild(sender);
      content.appendChild(document.createTextNode(': ' + String(msg.displayContent ?? '')));

      const meta = document.createElement('div');
      meta.className = 'sc-message-meta';
      meta.textContent = new Date(msg.timestamp).toLocaleTimeString();

      bubble.appendChild(content);
      bubble.appendChild(meta);
      container.appendChild(bubble);
    });

    if (nearBottom) container.scrollTop = container.scrollHeight;
  }

  async function sendMessage(event) {
    event.preventDefault();
    const input = $('scMessageInput');
    const text = input.value.trim();
    if (!text || !state.partner) return;

    const encrypted = await encryptMessage(text, state.partner);
    const allMsgs = DB.getMessages();

    allMsgs.push({
      sender: state.username,
      recipient: state.partner,
      ciphertext: encrypted,
      timestamp: new Date().toISOString()
    });

    DB.saveMessages(allMsgs);
    input.value = '';
    loadMessages();
  }

  function logout() {
    showAuthView();
    setStatus('scAuthStatus', 'Đã đăng xuất thành công.', 'success');
  }

  function startPolling() {
    stopPolling();
    state.pollTimer = setInterval(() => {
      if (state.username && state.partner) loadMessages();
    }, 1500);
  }

  function stopPolling() {
    if (state.pollTimer) {
      clearInterval(state.pollTimer);
      state.pollTimer = null;
    }
  }

  $('scLoginTab').addEventListener('click', () => setAuthMode('login'));
  $('scRegisterTab').addEventListener('click', () => setAuthMode('register'));
  $('scAuthForm').addEventListener('submit', handleAuth);
  $('scComposeForm').addEventListener('submit', sendMessage);
  $('scRefreshUsers').addEventListener('click', loadUsers);
  $('scLogoutBtn').addEventListener('click', logout);

  // Khởi tạo kiểm tra phiên đăng nhập cũ
  const savedUser = DB.getCurrentUser();
  if (savedUser && DB.getUsers().some(u => u.username === savedUser)) {
    showChatView(savedUser);
  } else {
    showAuthView();
  }
})();
</script>
