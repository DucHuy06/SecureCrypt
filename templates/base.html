<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SecureCrypt - Cryptography Playground{% endblock %}</title>
    <!-- Google Font Plus Jakarta Sans & FontAwesome icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #151d2a;
            --border-color: #222f43;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-indigo: #6366f1;
            --accent-indigo-hover: #4f46e5;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-cyan: #06b6d4;
            --accent-rose: #f43f5e;
            --accent-purple: #d946ef;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Header Bar */
        .top-navbar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: #ffffff;
            text-decoration: none;
        }
        .brand-logo i { color: var(--accent-indigo); font-size: 20px; }

        .nav-tabs-group {
            display: flex;
            align-items: center;
            background: #111827;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .nav-tab-item {
            color: var(--text-muted);
            text-decoration: none;
            padding: 7px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 7px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-tab-item:hover { color: var(--text-main); }
        .nav-tab-item.active { background: var(--accent-indigo); color: #ffffff; }

        .right-header-placeholder { min-width: 80px; }
        .app-container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }

        /* Modern Custom Form Controls - Khắc phục triệt để ngắt dòng sớm */
        textarea, input[type="text"], input[type="password"], select {
            display: block !important;
            width: 100% !important;
            background-color: #0f172a !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 10px !important;
            color: #f8fafc !important;
            padding: 12px 16px !important;
            font-family: 'Plus Jakarta Sans', monospace !important;
            font-size: 13.5px !important;
            outline: none !important;
            box-sizing: border-box !important;
            transition: all 0.2s ease !important;
            margin-top: 6px;
            margin-bottom: 12px;
            white-space: pre-wrap !important;
            word-break: break-all !important;
            overflow-wrap: anywhere !important;
        }

        textarea:focus, input[type="text"]:focus, input[type="password"]:focus, select:focus {
            border-color: var(--accent-indigo) !important;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2) !important;
        }

        /* Styled Buttons */
        button, input[type="button"], input[type="submit"] {
            background: #1e293b;
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-right: 6px;
            margin-bottom: 8px;
        }

        button:hover, input[type="button"]:hover {
            background: var(--accent-indigo);
            border-color: var(--accent-indigo);
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* Modern Card Containers */
        .crypto-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .card-title-header {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        /* Step Visualizer Card */
        .step-trace-box {
            background: #0d1322;
            border: 1px dashed var(--accent-indigo);
            border-radius: 12px;
            padding: 18px;
            margin-top: 16px;
        }
        .step-trace-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-cyan);
            text-transform: uppercase;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header class="top-navbar">
        <a href="/" class="brand-logo">
            <i class="fa-solid fa-shield-halved"></i>
            <span>SecureCrypt</span>
        </a>

        <nav class="nav-tabs-group">
            <a href="/" class="nav-tab-item {% if request.path == '/' or request.path in ['/des', '/aes', '/md5', '/sha256', '/rsa', '/elgamal', '/integrity'] %}active{% endif %}">
                <i class="fa-solid fa-wrench"></i> Tools
            </a>
            <a href="/demo" class="nav-tab-item {% if request.path == '/demo' or request.path == '/demos' %}active{% endif %}">
                <i class="fa-solid fa-flask"></i> Demos
            </a>
            <a href="/about" class="nav-tab-item {% if request.path == '/about' %}active{% endif %}">
                <i class="fa-solid fa-graduation-cap"></i> Learn
            </a>
        </nav>

        <div class="right-header-placeholder"></div>
    </header>

    <main class="app-container">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
